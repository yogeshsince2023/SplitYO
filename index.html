<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>SplitMate — Deterministic Shared Expense Management</title>
    <meta name="description" content="SplitMate is a modern, 100% free expense-sharing platform with AI natural language parsing, integer precision math, and instant UPI settlement." />
    <link rel="canonical" href="https://splitmate.dev/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#6366f1" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Open Graph Metadata -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="SplitMate — Deterministic Shared Expense Management" />
    <meta property="og:description" content="100% Free Forever expense-sharing platform with deterministic integer financial precision, AI voice entry, and instant direct UPI settlement." />
    <meta property="og:url" content="https://splitmate.dev/" />
    <meta property="og:image" content="https://splitmate.dev/favicon.svg" />

    <!-- Twitter / X Card Metadata -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SplitMate — Deterministic Shared Expense Management" />
    <meta name="twitter:description" content="Zero subscriptions, zero paywalls. Deterministic shared expense calculations with AI parsing and instant UPI settlement." />
    <meta name="twitter:image" content="https://splitmate.dev/favicon.svg" />

    <!-- Content Security Policy -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://images.unsplash.com; connect-src 'self';" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "SplitMate",
      "operatingSystem": "Web, Android, iOS",
      "applicationCategory": "FinanceApplication",
      "description": "Deterministic, 100% free shared expense management platform with AI and UPI settlement.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
